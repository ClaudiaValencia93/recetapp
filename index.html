<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecetApp: compara precios de medicamentos</title>
  <meta name="description" content="Compara precios de medicamentos entre farmacias de Colombia y encuentra la opción más barata por unidad.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="encabezado">
    <h1>RecetApp</h1>
    <p>Compara precios de medicamentos entre farmacias de Colombia.</p>
  </header>

  <main class="contenido">
    <form id="formulario" class="buscador" role="search">
      <label for="buscador" class="sr-only">Buscar medicamento</label>
      <input id="buscador" type="search" placeholder="Nombre, marca o principio activo"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
    </form>

    <p id="fecha-datos" class="fecha"></p>
    <p id="resumen" class="resumen" aria-live="polite"></p>
    <div id="resultados"></div>
  </main>

  <footer class="aviso" role="note">
    RecetApp compara precios; no reemplaza la indicación de tu médico o farmacéutico
  </footer>
</body>
</html>
